<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#90CAF9"/> <!-- 更暗淡的蓝色 -->
      <stop offset="50%" style="stop-color:#64B5F6"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </radialGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#EF9A9A;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#EF9A9A;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0, 10)"> <!-- 整体下沉 -->
    <!-- 身体 -->
    <path d="M 100 45 C 135 45, 155 72, 158 110 C 161 148, 140 168, 100 168 C 60 168, 39 148, 42 110 C 45 72, 65 45, 100 45 Z" 
          fill="url(#bodyBlue)" stroke="#1565C0" stroke-width="3"/>
    <!-- 脸部（位置略低） -->
    <ellipse cx="100" cy="118" rx="45" ry="38" fill="#FFFFFF" opacity="0.9"/>
    <!-- 手臂（下垂贴身体） -->
    <ellipse cx="45" cy="125" rx="10" ry="18" fill="#64B5F6" stroke="#1565C0" stroke-width="2.5" transform="rotate(10, 45, 125)"/>
    <ellipse cx="155" cy="125" rx="10" ry="18" fill="#64B5F6" stroke="#1565C0" stroke-width="2.5" transform="rotate(-10, 155, 125)"/>
    <!-- 卷毛（蔫了） -->
    <path d="M 100 48 Q 95 35 90 30 Q 85 25 88 20" fill="none" stroke="#1565C0" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M 100 48 Q 95 35 90 30 Q 85 25 88 20; M 100 48 Q 95 38 92 35 Q 90 32 91 28" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 眉毛（八字下垂） -->
    <path d="M 68 95 Q 78 100 88 95" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 112 95 Q 122 100 132 95" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 眼睛（下垂眼） -->
    <g transform="translate(78, 108)">
      <ellipse rx="13" ry="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
      <g transform="translate(0, 3)"> <!-- 瞳孔下移 -->
        <circle r="8" fill="#263238"/>
        <circle r="5" fill="#000000"/>
        <circle r="3" cx="2" cy="-2" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <!-- 下眼睑/眼袋 -->
      <path d="M -10 12 Q 0 16 10 12" fill="none" stroke="#EF9A9A" stroke-width="1.5" opacity="0.6"/>
    </g>
    <g transform="translate(122, 108)">
      <ellipse rx="13" ry="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
      <g transform="translate(0, 3)">
        <circle r="8" fill="#263238"/>
        <circle r="5" fill="#000000"/>
        <circle r="3" cx="2" cy="-2" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <path d="M -10 12 Q 0 16 10 12" fill="none" stroke="#EF9A9A" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- 眼泪 -->
    <g>
      <path d="M 78 118 Q 76 128 78 135 Q 80 128 78 118" fill="#81D4FA" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,25" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 122 118 Q 124 128 122 135 Q 120 128 122 118" fill="#81D4FA" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,25" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      </path>
    </g>
    <!-- 腮红（苍白） -->
    <ellipse cx="62" cy="122" rx="9" ry="5" fill="url(#blushGrad)"/>
    <ellipse cx="138" cy="122" rx="9" ry="5" fill="url(#blushGrad)"/>
    <!-- 嘴巴（下撇） -->
    <path d="M 95 140 Q 100 135 105 140" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 阴影（氛围） -->
    <ellipse cx="100" cy="185" rx="60" ry="10" fill="#000000" opacity="0.1">
      <animate attributeName="rx" values="60;55;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>