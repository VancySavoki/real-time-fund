<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#81D4FA"/>
      <stop offset="50%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </radialGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <g transform="translate(100,100) rotate(-10) translate(-100,-100)"> <!-- 整体倾斜 -->
    <!-- 问号 -->
    <g transform="translate(130, 25)">
      <text x="0" y="0" font-size="30" fill="#FFD700" font-weight="bold" font-family="Arial">?</text>
      <animateTransform attributeName="transform" type="rotate" values="0 130 25; 20 130 25; 0 130 25; -20 130 25; 0 130 25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </g>
    <!-- 身体 -->
    <path d="M 100 40 C 140 40, 162 70, 165 110 C 168 150, 145 170, 100 170 C 55 170, 32 150, 35 110 C 38 70, 60 40, 100 40 Z" 
          fill="url(#bodyBlue)" stroke="#1565C0" stroke-width="3"/>
    <!-- 脸部 -->
    <ellipse cx="100" cy="115" rx="48" ry="42" fill="#FFFFFF" opacity="0.95"/>
    <!-- 手臂（举起摊手） -->
    <g transform="translate(0, -5)">
      <ellipse cx="40" cy="100" rx="12" ry="20" fill="#4FC3F7" stroke="#1565C0" stroke-width="2.5" transform="rotate(80, 40, 100)"/>
      <ellipse cx="160" cy="100" rx="12" ry="20" fill="#4FC3F7" stroke="#1565C0" stroke-width="2.5" transform="rotate(-80, 160, 100)"/>
      <circle cx="35" cy="75" r="8" fill="#4FC3F7" stroke="#1565C0" stroke-width="2"/>
      <circle cx="165" cy="75" r="8" fill="#4FC3F7" stroke="#1565C0" stroke-width="2"/>
    </g>
    <!-- 卷毛（打结状） -->
    <path d="M 100 45 Q 95 25 105 20 Q 115 15 100 10 Q 90 8 95 20" fill="none" stroke="#1565C0" stroke-width="4" stroke-linecap="round"/>
    <!-- 眼睛（大小眼） -->
    <g transform="translate(75, 100)">
      <ellipse rx="12" ry="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/> <!-- 小眼 -->
      <circle r="6" fill="#263238"/>
      <circle r="3" fill="#000000"/>
      <circle r="2" cx="2" cy="-2" fill="#FFFFFF"/>
    </g>
    <g transform="translate(125, 95)">
      <ellipse rx="16" ry="18" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/> <!-- 大眼 -->
      <circle r="9" fill="#263238"/>
      <circle r="6" fill="#000000"/>
      <circle r="3.5" cx="3" cy="-3" fill="#FFFFFF"/>
      <!-- 眼皮半闭 -->
      <path d="M -16 -5 Q 0 -12 16 -5" fill="none" stroke="#4FC3F7" stroke-width="3"/>
    </g>
    <!-- 腮红（加重） -->
    <ellipse cx="60" cy="120" rx="12" ry="7" fill="url(#blushGrad)"/>
    <ellipse cx="140" cy="120" rx="12" ry="7" fill="url(#blushGrad)"/>
    <!-- 嘴巴（波浪线） -->
    <path d="M 90 135 Q 95 130 100 135 Q 105 140 110 135" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 晕眩符号 -->
    <g transform="translate(170, 60)" opacity="0.7">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z" fill="#FFD700">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>