<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#81D4FA"/>
      <stop offset="50%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </radialGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0, 5)">
    <!-- 灯泡（思考符号） -->
    <g transform="translate(140, 30)">
      <circle r="12" fill="#FFD700" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <rect x="-4" y="10" width="8" height="6" fill="#FFD700" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </rect>
    </g>
    <!-- 思考气泡 -->
    <g transform="translate(160, 60)" opacity="0">
      <circle r="5" fill="#B3E5FC"/>
      <circle cx="12" cy="-8" r="3" fill="#B3E5FC"/>
      <circle cx="20" cy="-16" r="2" fill="#B3E5FC"/>
      <animate attributeName="opacity" values="0;0;1;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="160,60; 160,55; 160,50" dur="3s" repeatCount="indefinite"/>
    </g>
    <!-- 身体 -->
    <path d="M 100 40 C 140 40, 162 70, 165 110 C 168 150, 145 170, 100 170 C 55 170, 32 150, 35 110 C 38 70, 60 40, 100 40 Z" 
          fill="url(#bodyBlue)" stroke="#1565C0" stroke-width="3"/>
    <!-- 脸部 -->
    <ellipse cx="100" cy="115" rx="48" ry="42" fill="#FFFFFF" opacity="0.95"/>
    <!-- 左手（下垂） -->
    <ellipse cx="42" cy="115" rx="12" ry="20" fill="#4FC3F7" stroke="#1565C0" stroke-width="2.5" transform="rotate(20, 42, 115)"/>
    <!-- 右手（托腮） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 158 115; 5 158 115; 0 158 115" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="158" cy="115" rx="12" ry="20" fill="#4FC3F7" stroke="#1565C0" stroke-width="2.5" transform="rotate(-60, 158, 115)"/>
      <circle cx="145" cy="95" r="10" fill="#4FC3F7" stroke="#1565C0" stroke-width="2"/> <!-- 手 -->
    </g>
    <!-- 头顶卷毛 -->
    <path d="M 100 45 Q 105 30 100 23 Q 95 17 100 13 Q 105 9 110 15" fill="none" stroke="#1565C0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="110" cy="15" r="4" fill="#4FC3F7" stroke="#1565C0" stroke-width="2"/>
    <!-- 眼睛（向上看） -->
    <g transform="translate(78, 100)">
      <ellipse rx="14" ry="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
      <g transform="translate(0, -4)"> <!-- 瞳孔上移 -->
        <circle r="9" fill="#263238"/>
        <circle r="6" fill="#000000"/>
        <circle r="3.5" cx="3" cy="-3" fill="#FFFFFF" opacity="0.9"/>
      </g>
    </g>
    <g transform="translate(122, 100)">
      <ellipse rx="14" ry="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
      <g transform="translate(0, -4)">
        <circle r="9" fill="#263238"/>
        <circle r="6" fill="#000000"/>
        <circle r="3.5" cx="3" cy="-3" fill="#FFFFFF" opacity="0.9"/>
      </g>
    </g>
    <!-- 腮红 -->
    <ellipse cx="60" cy="125" rx="10" ry="6" fill="url(#blushGrad)"/>
    <ellipse cx="140" cy="125" rx="10" ry="6" fill="url(#blushGrad)"/>
    <!-- 嘴巴（抿嘴） -->
    <path d="M 95 130 Q 100 128 105 130" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 眉毛（微皱） -->
    <path d="M 68 88 Q 78 85 88 88" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 112 88 Q 122 85 132 88" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>